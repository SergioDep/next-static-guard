name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: node --version
      - run: npm --version
      - run: npm ci
      - name: Verify Git version
        run: node -e "const v=require('child_process').execFileSync('git',['--version'],{encoding:'utf8'}).match(/\d+\.\d+\.\d+/)[0];if(!require('semver').gte(v,'2.47.0'))process.exit(1)"
      - run: npm run build
      - run: npm run check
  framework:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:framework
      - run: npm run test:comparison
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build -f tests/bench/Dockerfile -t next-static-guard-bench .
      - run: mkdir -p bench-results && docker run --rm --cpus 2 --memory 4g --user "$(id -u):$(id -g)" -v "$PWD/bench-results:/work/bench-results" next-static-guard-bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-results
          path: bench-results/results.json
          retention-days: 7
